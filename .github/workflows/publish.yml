name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_CENTRAL: ${{ secrets.SONATYPE_USERNAME != '' && secrets.SONATYPE_PASSWORD != '' && secrets.SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check release tag
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Publishing requires a v* tag, got ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish to GitHub Packages
        run: ./gradlew :lib:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish local artifacts
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          rm -rf local-repo build/central-bundle build/central-bundle.zip build/release-assets
          ./gradlew :lib:publishAllPublicationsToLocalRepository

      - name: Prepare GitHub Release assets
        run: |
          mkdir -p build/release-assets
          cp "local-repo/top/jayvin/dev/kx-essentials-jvm/${VERSION_NAME}/kx-essentials-jvm-${VERSION_NAME}.jar"             "build/release-assets/kx-essentials-${VERSION_NAME}-jvm.jar"
          cp "local-repo/top/jayvin/dev/kx-essentials-android/${VERSION_NAME}/kx-essentials-android-${VERSION_NAME}.aar"             "build/release-assets/kx-essentials-${VERSION_NAME}-android.aar"
          cp "local-repo/top/jayvin/dev/kx-essentials-js/${VERSION_NAME}/kx-essentials-js-${VERSION_NAME}.klib"             "build/release-assets/kx-essentials-${VERSION_NAME}-js.klib"
          cp "local-repo/top/jayvin/dev/kx-essentials/${VERSION_NAME}/kx-essentials-${VERSION_NAME}-sources.jar"             "build/release-assets/kx-essentials-${VERSION_NAME}-sources.jar"
          (cd local-repo && zip -qr "../build/release-assets/kx-essentials-${VERSION_NAME}.zip" top/jayvin/dev)

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME"               --title "Kx Essentials ${VERSION_NAME}"               --notes "Kotlin 2.0+ release. Artifacts: JVM JAR, Android AAR, JS klib, sources, and the Maven repository bundle."
          fi
          gh release upload "$GITHUB_REF_NAME" build/release-assets/* --clobber

      - name: Bundle Maven Central artifacts
        if: env.HAS_CENTRAL == 'true'
        run: |
          mkdir -p build/central-bundle/top/jayvin/dev
          cp -R local-repo/top/jayvin/dev/kx-essentials build/central-bundle/top/jayvin/dev/
          find build/central-bundle -type f -name 'maven-metadata*' -delete
          (cd build/central-bundle && zip -qr ../central-bundle.zip top)

      - name: Skip Maven Central
        if: env.HAS_CENTRAL != 'true'
        run: echo "SONATYPE_USERNAME / SONATYPE_PASSWORD / SIGNING_KEY are not all configured; GitHub Packages was published, Maven Central was skipped."

      - name: Upload bundle to Maven Central
        if: env.HAS_CENTRAL == 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          token="$(printf '%s:%s' "$SONATYPE_USERNAME" "$SONATYPE_PASSWORD" | base64 | tr -d '\n')"
          version="${GITHUB_REF_NAME#v}"
          deployment_id="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $token" \
            --form bundle=@build/central-bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?name=kx-essentials-${version}&publishingType=AUTOMATIC")"
          echo "Deployment id: $deployment_id"
          echo "Central release submitted; publication continues asynchronously."
