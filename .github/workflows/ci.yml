name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  jvm-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM and JS tests
        run: ./gradlew :lib:jvmTest :lib:jsTest :lib:jvmJar

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android library and demo
        run: ./gradlew :lib:assembleDebug :demo:assembleDebug
