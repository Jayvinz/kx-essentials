name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  jvm-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM and JS tests
        run: ./gradlew :lib:jvmTest :lib:jsTest :lib:jvmJar

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android library and demo
        run: ./gradlew :lib:assembleDebug :demo:assembleDebug

  ios:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile iOS targets
        run: ./gradlew :lib:compileKotlinIosArm64 :lib:compileKotlinIosSimulatorArm64 :lib:linkDebugFrameworkIosArm64
      - uses: actions/upload-artifact@v4
        with:
          name: kx-iosArm64-framework
          path: lib/build/bin/iosArm64/debugFramework/Kx.framework
